<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <title>Liferay React Map CX App</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script type="text/javascript">

      (function () {
          if (!window.Liferay) {
              window.Liferay = {};
          }
          
          if (!window.Liferay.Util) {
              window.Liferay.Util = {};
          }

          if (!window.Liferay.Icons) {
              window.Liferay.Icons = {};
          }

          window.Liferay.Util.fetch = function (url, options = {}) {
              const basicAuth = "Basic " + btoa("dan.frizelle@rspca.org.uk:Hajtleb9!");

              const headers = new Headers(options.headers || {});
              headers.set("Authorization", basicAuth);

              return fetch(url, {
                  ...options,
                  headers,
              });
          };

          if (!window.Liferay.ThemeDisplay) {
            window.Liferay.ThemeDisplay = {};
            window.Liferay.ThemeDisplay.getLanguageId = () => {return "fr_FR";};
            window.Liferay.ThemeDisplay.getUserId = () => {return 20126;};
            window.Liferay.ThemeDisplay.getSiteGroupId = () => {return 20120;};
            window.Liferay.ThemeDisplay.getPlid = () => {return 1;};
          }

          window.Liferay.Icons.spritemap = "/icons.svg";
      })();

    </script>

  </head>
  <body>
    <script type="module" src="/src/index.jsx"></script> 

    <noscript>You need to enable JavaScript to run this app.</noscript>
