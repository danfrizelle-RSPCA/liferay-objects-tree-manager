assemble:
    - from: build/static
      into: static
      
flow-editor-import-maps-entry:
    bareSpecifier: flowEditor
    name: Flow Editor JS Import Maps Entry
    type: jsImportMapsEntry
    url: assets/flow-editor-*.js
flow-editor-custom-element-css:
    url: assets/flow-editor.css
    type: globalCSS
    name: Flow Editor CSS

flow-navigator-import-maps-entry:
    bareSpecifier: flowNavigator
    name: Flow Navigator JS Import Maps Entry
    type: jsImportMapsEntry
    url: assets/flow-navigator-*.js
flow-navigator-custom-element-css:
    url: assets/flow-navigator.css
    type: globalCSS
    name: Flow Navigator CSS
flow-navigator-user-agent:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Flow Navigator User Agent
    scopes:
        - c_decisiontree.read
        - c_question.read
        - c_option.read
    type: oAuthApplicationUserAgent