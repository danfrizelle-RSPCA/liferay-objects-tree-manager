assemble:
    - from: build/static
      into: static
      
graph-editor-import-maps-entry:
    bareSpecifier: graphEditor
    name: Graph Editor JS Import Maps Entry
    type: jsImportMapsEntry
    url: assets/editor-*.js
graph-editor-custom-element-css:
    url: assets/editor-*.css
    type: globalCSS
    name: Graph Editor CSS

graph-navigator-import-maps-entry:
    bareSpecifier: graphNavigator
    name: Graph Navigator JS Import Maps Entry
    type: jsImportMapsEntry
    url: assets/navigator-*.js
graph-navigator-custom-element-css:
    url: assets/navigator-*.css
    type: globalCSS
    name: Graph Navigator CSS
graph-navigator-user-agent:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Graph Navigator User Agent
    scopes:
        - c_decisiontree.read
        - c_question.read
        - c_option.read
    type: oAuthApplicationUserAgent